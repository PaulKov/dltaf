name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Build wheel
        run: python -m build
      - name: Wheel smoke install
        run: |
          python -m venv .smoke-venv
          . .smoke-venv/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python -c "from dlt_utils.manifest_runner import get_source_registry; assert get_source_registry().resolve('sql_database').kind == 'sql_database'"
          dltaf plugins list
